name: Keep repo active

# GitHub disables scheduled workflows after 60 days without repository
# activity, which would silently kill supabase-keepalive.yml during any quiet
# stretch. A monthly empty commit keeps the repo inside that window.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push an empty commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows enabled"
          git push
